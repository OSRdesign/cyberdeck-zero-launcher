# Board profile for the launcher, written by install.sh (board: pc-fzm1-2).
# Loaded by the launcher unit (EnvironmentFile). Edit freely: install.sh then leaves it alone unless --force.
# applaunch-profile-sum: 2904715111 905
APPLAUNCH_BOARD=pc-fzm1-2
APPLAUNCH_DISPLAY=dpi-scaled
APPLAUNCH_FB=/dev/fb0
APPLAUNCH_LOGICAL=800x1280
APPLAUNCH_ROTATE=90
# panel size in mm, from the EDID of eDP-1: the layout's density
APPLAUNCH_PANEL_MM=152x94
APPLAUNCH_TOUCH_DEV=auto
APPLAUNCH_TOUCH_ORIENT=buffer
APPLAUNCH_BACKLIGHT=sysfs:/sys/class/backlight/intel_backlight
# the tablet's built-in keyboard device (i8042, bus 0011) is always there: it does not count as a
# connected keyboard (the on-screen keyboard shows without a USB or Bluetooth one); its keys still work
APPLAUNCH_KBD_IGNORE=bus:0011
# the Store tile starts hidden (the Store's hub has arm64 packages only); Settings > Launcher can show it
APPLAUNCH_HIDE_TILES=app_Store
LV_LINUX_FBDEV_DEVICE=/dev/fb0
# the deck's legacy touch axes (set in its user service) must not apply here: neutral values
APPLAUNCH_TOUCH_SWAP_XY=0
APPLAUNCH_TOUCH_INVERT_X=0
APPLAUNCH_TOUCH_INVERT_Y=0
APPLAUNCH_PDA=1
