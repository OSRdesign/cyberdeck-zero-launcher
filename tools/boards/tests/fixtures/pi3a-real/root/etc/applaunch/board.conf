# Board profile for the launcher, written by install.sh (board: pi3a-wsdsi43).
# Loaded by the launcher unit (EnvironmentFile). Edit freely: install.sh then leaves it alone unless --force.
# applaunch-profile-sum: 932526304 678
APPLAUNCH_BOARD=pi3a-wsdsi43
APPLAUNCH_FB=/dev/fb0
APPLAUNCH_LOGICAL=800x480
APPLAUNCH_ROTATE=0
APPLAUNCH_COMPAT_SCALE=2
# landscape visible area in mm (800x480 at 0.117 mm pitch; to be confirmed with a ruler): the layout's density
APPLAUNCH_PANEL_MM=94x56
APPLAUNCH_TOUCH_DEV=auto
APPLAUNCH_TOUCH_ORIENT=buffer
APPLAUNCH_BACKLIGHT=sysfs:/sys/class/backlight/10-0045
# idle dim level, percent of the backlight: 1..100 (the launcher's default is 10)
APPLAUNCH_DIM_PERCENT=10
LV_LINUX_FBDEV_DEVICE=/dev/fb0
# the deck's legacy touch axes (set in its user service) must not apply here: neutral values
APPLAUNCH_TOUCH_SWAP_XY=0
APPLAUNCH_TOUCH_INVERT_X=0
APPLAUNCH_TOUCH_INVERT_Y=0
